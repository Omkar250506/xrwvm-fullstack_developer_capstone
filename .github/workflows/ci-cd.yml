name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        run: echo "Setting up Python lint job"

      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Lint Python Files
        run: |
          pylint server/djangoapp --disable=all --enable=E,F --exit-zero

      - name: Post Run actions/checkout@v3
        run: echo "Python lint job completed"

      - name: Complete job
        run: echo "Lint Python Files completed successfully"

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        run: echo "Setting up JavaScript lint job"

      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: server/frontend
        run: npm install

      - name: Install JSHint
        run: npm install --global jshint

      - name: Run JavaScript linter
        run: |
          jshint server/frontend/src --exclude server/frontend/node_modules || true

      - name: Post Run actions/checkout@v3
        run: echo "JavaScript lint job completed"

      - name: Complete job
        run: echo "Lint JavaScript Files completed successfully"
